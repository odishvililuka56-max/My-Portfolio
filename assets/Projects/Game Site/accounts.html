<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Accounts - GameShop</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/accounts.css">
    <script src="assets/javascript/auth.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo" title="Go to homepage">G</a>
            <button id="menu-toggle" class="menu-toggle" aria-label="Toggle navigation">☰</button>
            <div class="header-right">
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                    <span class="theme-icon">☀️</span>
                </button>
                <nav>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="products.html">Products</a></li>
                        <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
                    </ul>
                </nav>
                <div id="user-profile"></div>
            </div>
        </div>
    </header>

    <main>
        <section class="accounts-section">
            <div class="container">
                <h1>Your Accounts</h1>
                <div class="accounts-container">
                    <div id="accounts-list" class="accounts-list">
                    </div>
                    <a href="login.html" class="btn-add-account">Add Account</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2023 GameShop. All rights reserved.</p>
        </div>
    </footer>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal-content">
            <h2>Delete Account</h2>
            <p id="modalMessage">Are you sure you want to delete this account?</p>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-btn modal-btn-confirm" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <script src="assets/javascript/accounts.js"></script>
</body>
</html>
