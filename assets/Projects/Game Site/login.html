<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - GameShop</title>
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-logo">G</div>
            <h1>Register to GameShop</h1>
            <form id="register-form">
                <div class="form-group">
                    <label for="login">Username</label>
                    <input type="text" id="login" placeholder="Letters only (A-Z, a-z)" pattern="^[a-zA-Z]+$" title="Username must contain only letters" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password (letters & numbers)" required>
                </div>
                <button type="submit" class="btn-submit">Register</button>
            </form>
        </div>
    </div>

    <script src="assets/javascript/auth.js"></script>
</body>
</html>
